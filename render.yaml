# Render.com Blueprint for the Pristine Forests backend.
# Free tier, no credit card required.
# Sleeps after 15 minutes of inactivity (~30s cold start).
#
# Setup (one time, in browser):
#   1. https://dashboard.render.com -> sign up with GitHub (no CC).
#   2. New > Blueprint -> connect this repo (Krishh003/pfShopifyAppExtension).
#   3. Render reads this file and prompts for the secret env vars below.
#   4. Paste values from pristine-ext/web/.env (SHOPIFY_*, SHOP_DOMAIN,
#      WEBHOOK_SECRET, PREORDER_CART_CONFIG).
#   5. Apply -> Render builds Dockerfile and deploys.
#
# After first deploy: copy the *.onrender.com URL into
# .tmp-theme-live/sections/header-group.json and re-push the theme.

services:
  - type: web
    name: pristine-preorder-backend
    runtime: docker
    plan: free
    region: singapore
    branch: feat/render-deploy-and-cart-fixes
    rootDir: pristine-ext/web
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/preorder-cart/config
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: "2026-04"
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: SHOP_DOMAIN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: PREORDER_CART_CONFIG
        sync: false
