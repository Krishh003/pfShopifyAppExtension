api_version = "2024-04"

# 1. Main Banner Block
[[extensions]]
name = "Pristine Banner"
handle = "pristine-banner"
uid = "c70dccda-8ce7-2309-322e-f5729e6b1fe9ed061ad1"
type = "ui_extension"

[[extensions.targeting]]
target = "customer-account.profile.block.render"
module = "./src/ProfileBanner.jsx"

[extensions.capabilities]
api_access = true
network_access = false

[[extensions.metafields]]
namespace = "pristine"
key = "credits"

[[extensions.metafields]]
namespace = "pristine"
key = "coupons"

[extensions.settings]
[[extensions.settings.fields]]
