# Fly.io app configuration for the Pristine Forests backend.
# Created 2026-05-18. Generated by hand; rerun `flyctl launch --no-deploy`
# only if you want flyctl to manage this file.

app = "pristine-preorder-backend"
primary_region = "bom"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8081"
  API_VERSION = "2026-04"
  # SHOPIFY_ACCESS_TOKEN, SHOPIFY_API_KEY, SHOPIFY_API_SECRET, SHOP_DOMAIN,
  # WEBHOOK_SECRET, PREORDER_CART_CONFIG are set via `flyctl secrets set`.

[[services]]
  protocol = "tcp"
  internal_port = 8081
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    method = "GET"
    path = "/api/preorder-cart/config"
    protocol = "http"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
  cpu_kind = "shared"

[experimental]
  auto_rollback = true
